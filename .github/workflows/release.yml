name: build-apk

on:
  push:
    tags:
      - "BETA-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          printf 'KEYSTORE_FILE=keystore.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#BETA-}"
          echo "NAME=${TAG}" >> "$GITHUB_OUTPUT"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG#*.}"
          echo "CODE=$((MAJOR * 100 + MINOR))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.NAME }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.CODE }}
        run: ./gradlew assembleRelease

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Plex.apk
          TAG="${GITHUB_REF_NAME#BETA-}"
          TITLE="Beta-${TAG}"
          echo "**${TITLE} — mobile release.**" > NOTES.md
          PREV="$(git tag --sort=-v:refname | head -1)^"
          { git log "${PREV}..HEAD" --pretty="format:- %s" 2>/dev/null || git log --pretty="- %s" -10; } >> NOTES.md
          gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
          gh release create "$GITHUB_REF_NAME" \
            --title "$TITLE" \
            --notes-file NOTES.md \
            Plex.apk

      - name: Generate delta patch and update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#BETA-}"
          CODE=$(( ${TAG%%.*} * 100 + ${TAG#*.} ))
          APK_SHA="$(sha256sum Plex.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c%s Plex.apk)"
          PREV="$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty' 2>/dev/null || true)"
          FROM_CODE=0
          FROM_VER=""
          PATCHED=0
          if [ -n "$PREV" ]; then
            gh release download "$PREV" -p "Plex.apk" -o old.apk 2>/dev/null || true
            if [ -s old.apk ]; then
              sudo apt-get update -qq && sudo apt-get install -y bsdiff
              PT="${PREV#BETA-}"
              FROM_VER="$PT"
              FROM_CODE=$(( ${PT%%.*} * 100 + ${PT#*.} ))
              bsdiff old.apk Plex.apk Plex.patch
              PATCHED=1
            fi
          fi
          PATCH_SHA="NONE"
          PATCH_SIZE=0
          PATCH_URL=""
          if [ "$PATCHED" = "1" ]; then
            PATCH_SHA="$(sha256sum Plex.patch | awk '{print $1}')"
            PATCH_SIZE="$(stat -c%s Plex.patch)"
            PATCH_URL="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Plex.patch"
            gh release upload "$GITHUB_REF_NAME" Plex.patch --clobber
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Plex.apk"
          cat > update-manifest.json <<EOF
          {
            "toVersion": "$TAG",
            "toCode": $CODE,
            "fromVersion": "$FROM_VER",
            "fromCode": $FROM_CODE,
            "apkSize": $APK_SIZE,
            "apkSha256": "$APK_SHA",
            "apkUrl": "$APK_URL",
            "patchSize": $PATCH_SIZE,
            "patchSha256": "$PATCH_SHA",
            "patchUrl": "$PATCH_URL"
          }
          EOF
          gh release upload "$GITHUB_REF_NAME" update-manifest.json --clobber